<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> DOCUMENT </title>
    <link rel="icon" type="image/x-icon" href="https://cdn-icons-png.flaticon.com/512/4136/4136043.png">

    <style>
        input[type="submit"] {
            font-size: 16px;
            border-radius: 10px;
        }
    </style>
</head>

<body>
    <form action="index.php" method="POST" enctype="multipart/form-data">
        <!-- here enctype is so if some file we upload is very large it breaks it to simpler data-->
        <label for="username">username:</label>
        <input type="text" id="username" placeholder="Jaat" minlength="4" maxlength="10" required><br>

        <label for="password">password:</label>
        <input type="password" id="password" required><br>

        <label for="email">email:</label>
        <input type="email" id="email" placeholder="Jaat07@gmail.com" required><br>

        <label for="number">number:</label>
        <input type="number" id="number" placeholder="1234567890"><br>

        <label for="date">date:</label>
        <input type="date" id="date"><br>

        <label for="quantity"> quantity :</label>
        <input type="number" id="quantity" min="0" max="99" value="1"><br>



        <label for="title">title:</label>

        <label for="Mr."> Mr. </label>
        <input type="radio" id="Mr." value="Mr." name="title">
        <label for="Ms."> Ms. </label>
        <input type="radio" id="Ms." value="Ms." name="title">
        <label for="God."> God. </label>
        <input type="radio" id="God." value="God." name="title"><br>


        <label for="payment">payment</label>
        <select id="payment">
            <option value="visa">visa</option>
            <option value="credit">credit</option>
            <option value="mastercard">mastercard</option>
        </select><br>

        <label for="subscribe">subscribe: </label>
        <input type="checkbox" id="subscribe"><br>

        <label for="comment">comment</label>
        <textarea id="comment" rows="2" cols="10"></textarea><br>

        <label for="file">Upload file: </label>
        <input type="file" id="file" accept="image/jpeg, image/png"><br>

        <input type="submit" value="Submit">
        <input type="reset">

    </form>
</body>

</html>
